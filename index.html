<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Dünya</title>
<style>
  :root {
    --bg: #0b111c;
    --panel: #131b2b;
    --line: #26324a;
    --fg: #e8eefc;
    --muted: #8fa0c0;
    --meter: #4f9dff;
    --meter-full: #ff5d5d;
    --ok: #3ddc84;
    --warn: #ffcf3f;
    --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 13px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    height: 100%;
    display: flex; flex-direction: column; gap: 10px;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .top .l { justify-self: start; display: flex; gap: 6px; }
  .top .r { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .tot { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .tot b { color: var(--fg); font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .btn {
    height: 34px; padding: 0 10px;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line);
    font-family: var(--font); font-size: 12px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; text-transform: uppercase;
  }
  .btn:active { background: var(--line); }
  .btn[aria-pressed="true"] { background: var(--meter); border-color: var(--meter); color: #06101f; }
  .btn:focus-visible, .sw:focus-visible, .switch:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .btn.icon { width: 38px; padding: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .btn.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); border: 2px solid var(--bg); }
  .dot[data-st="connected"] { background: var(--ok); }
  .dot[data-st="connecting"] { background: var(--warn); }

  .counter {
    position: relative; width: 92px; height: 38px;
    border: 2px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .counter .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--meter); opacity: .35; transition: width .12s linear; }
  .counter .num { position: relative; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .counter.full { border-color: var(--meter-full); }
  .counter.full .bar { background: var(--meter-full); opacity: .45; }
  .counter.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }

  .stage { position: relative; flex: 1 1 auto; min-height: 0; border: 2px solid var(--line); background: #0b111c; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  .zoom button {
    width: 40px; height: 40px; padding: 0;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line);
    font-family: var(--font); font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .zoom button:active { background: var(--line); }
  .toast {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: var(--panel); border: 2px solid var(--meter-full);
    padding: 8px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; z-index: 5;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis;
  }
  .toast.on { opacity: 1; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }

  .palwrap { position: absolute; left: 8px; bottom: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .palbtn { width: 36px; height: 36px; padding: 0; border: 3px solid var(--fg); cursor: pointer; background: #e53935; box-shadow: 0 0 0 2px var(--bg); }
  .palbtn:active { transform: scale(.94); }
  .palette { display: grid; grid-template-columns: repeat(4, 32px); gap: 6px; padding: 6px; background: var(--panel); border: 2px solid var(--line); }
  .sw { width: 32px; height: 32px; border: 2px solid var(--line); padding: 0; cursor: pointer; }
  .sw[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 1px; }

  .settings {
    position: absolute; right: 8px; top: 8px; z-index: 6;
    width: min(270px, calc(100% - 16px));
    background: var(--panel); border: 2px solid var(--line);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .settings h2 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .srow b { font-variant-numeric: tabular-nums; }
  .switch { position: relative; flex: none; width: 44px; height: 26px; padding: 0; border: 2px solid var(--line); background: var(--bg); cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--muted); transition: transform .15s; }
  .switch[aria-checked="true"] { border-color: var(--meter); }
  .switch[aria-checked="true"]::after { background: var(--meter); transform: translateX(18px); }
  .settings { max-height: calc(100% - 16px); overflow-y: auto; }
  .settings hr { border: 0; border-top: 2px solid var(--line); margin: 0; width: 100%; }
  .acct { display: flex; flex-direction: column; gap: 8px; }
  .acct input {
    width: 100%; height: 34px; padding: 0 8px; margin: 0;
    background: var(--bg); color: var(--fg); border: 2px solid var(--line); border-radius: 0;
    font-family: var(--font); font-size: 16px; /* 16px: iOS yakınlaştırmasın */
    -webkit-user-select: text; user-select: text;
  }
  .acct input:focus-visible { outline: 3px solid var(--fg); outline-offset: 1px; }
  .acct .arow { display: flex; gap: 6px; }
  .acct .arow .btn { flex: 1 1 0; padding: 0 6px; }
  .acct .btn:disabled { opacity: .5; cursor: default; }
  .lnk { background: none; border: 0; padding: 4px 0; color: var(--meter); font-family: var(--font); font-size: 12px; text-align: left; cursor: pointer; text-decoration: underline; }
  .amsg { font-size: 12px; line-height: 1.4; color: var(--meter-full); min-height: 0; -webkit-user-select: text; user-select: text; }
  .amsg:empty { display: none; }
  .amsg.ok { color: var(--ok); }
  .idbox { border: 2px solid var(--warn); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; -webkit-user-select: text; user-select: text; }
  .idbox small { color: var(--muted); font-size: 11px; line-height: 1.4; }
  .idbox b { font-size: 22px; letter-spacing: .18em; color: var(--warn); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .counter .bar, .toast, .switch::after { transition: none; } .counter.shake { animation: none; } }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="l">
      <button class="btn icon" id="penbtn" type="button" aria-pressed="false" aria-label="Kalem" title="Kalem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16.5 3.5a2.1 2.1 0 013 3L8 18l-4 2z"/><path d="M14.5 5.5l3 3"/></svg></button>
      <button class="btn" id="gridbtn" type="button" aria-pressed="true">Izgara</button>
    </div>
    <div class="counter" id="counter" title="Piksel sınırı (en fazla 60)"><div class="bar" id="bar"></div><div class="num" id="num">0</div></div>
    <div class="r">
      <div class="tot"><span>Toplam</span><b id="total">0</b></div>
      <button class="btn icon" id="setbtn" type="button" aria-label="Ayarlar" aria-expanded="false" title="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg><i class="dot" id="dot" data-st="preview"></i></button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="loading" id="loading">Harita yükleniyor…</div>
    <div class="zoom">
      <button id="zin" type="button" aria-label="Yakınlaştır">+</button>
      <button id="zout" type="button" aria-label="Uzaklaştır">−</button>
      <button id="zfit" type="button" aria-label="Haritayı sığdır">□</button>
    </div>
    <div class="toast" id="toast">Sınır doldu</div>
    <div class="palwrap"><div class="palette" id="palette" hidden></div><button class="palbtn" id="palbtn" type="button" aria-label="Renk paleti" aria-expanded="false" title="Renk paleti"></button></div>
    <div class="settings" id="settings" hidden>
      <h2>Ayarlar</h2>
      <div class="srow"><span>Başkalarının piksel dalgası</span><button class="switch" id="rippleSw" type="button" role="switch" aria-checked="true" aria-label="Başkalarının piksel dalgası"></button></div>
      <div class="srow"><span>Bağlantı</span><b id="connTxt">Yerel mod</b></div>
      <div class="srow"><span>Çevrimiçi oyuncu</span><b id="onlineTxt">–</b></div>
      <hr>
      <div class="acct" id="acct">
        <h2>Hesap</h2>
        <div id="acOut" class="acct">
          <input id="acName" type="text" placeholder="Kullanıcı adı" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false" aria-label="Kullanıcı adı">
          <input id="acPass" type="password" placeholder="Şifre" maxlength="64" autocomplete="current-password" aria-label="Şifre">
          <div class="arow">
            <button class="btn" id="acCreate" type="button">Hesap oluştur</button>
            <button class="btn" id="acLogin" type="button">Giriş</button>
          </div>
          <button class="lnk" id="acForgot" type="button" aria-expanded="false">Şifremi unuttum</button>
          <div id="acRec" class="acct" hidden>
            <input id="acRecId" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="6 haneli ID" maxlength="6" autocomplete="off" aria-label="6 haneli ID">
            <input id="acRecPass" type="password" placeholder="Yeni şifre" maxlength="64" autocomplete="new-password" aria-label="Yeni şifre">
            <button class="btn" id="acRecBtn" type="button">Hesabı kurtar</button>
          </div>
        </div>
        <div id="acIn" class="acct" hidden>
          <div class="srow"><span>Hesap</span><b id="acNameTxt">–</b></div>
          <div class="idbox"><small>ID'n (şifreni unutursan hesabı bununla kurtarırsın, not al)</small><b id="acIdTxt">––––––</b></div>
          <button class="btn" id="acLogout" type="button">Çıkış yap</button>
        </div>
        <div class="amsg" id="acMsg" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  // Dünya ızgarası: harita fotoğrafının her noktası bir piksel. Sunucudakiyle aynı olmalı.
  var IW = 2334, IH = 2583, N = IW * IH;
  var MAX_USED = 60, RIPPLE_MS = 900, RIPPLE_R = 20;
  var WS_URL = (window.PIXEL_WS_URL || "").trim();
  var COLORS = [
    { n: "Bordo", c: "#7a1230" },
    { n: "Kırmızı", c: "#e53935" },
    { n: "Turuncu", c: "#fb8c00" },
    { n: "Sarı", c: "#fdd835" },
    { n: "Yeşil", c: "#43a047" },
    { n: "Koyu yeşil", c: "#1b5e20" },
    { n: "Turkuaz", c: "#00acc1" },
    { n: "Deniz mavisi", c: "#cae3ff" },
    { n: "Lacivert", c: "#1a237e" },
    { n: "Mor", c: "#8e24aa" },
    { n: "Siyah", c: "#111111" },
    { n: "Beyaz", c: "#ffffff" }
  ];
  var COL32 = COLORS.map(function (o) {
    var r = parseInt(o.c.slice(1, 3), 16), g = parseInt(o.c.slice(3, 5), 16), b = parseInt(o.c.slice(5, 7), 16);
    return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  });
  var KEY = "pixelDunya.net.v1", ID_KEY = "pixelDunya.id";

  var stage = document.getElementById("stage"), cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var photo = new Image(), photoOk = false;
  var ov = document.createElement("canvas"); ov.width = IW; ov.height = IH;
  var octx = ov.getContext("2d");
  var ovImg = octx.createImageData(IW, IH), ov32 = new Uint32Array(ovImg.data.buffer);
  var placed = new Uint8Array(N);           // 0 boş, 1..12 renk numarası
  var bx0 = 1e9, by0 = 1e9, bx1 = -1, by1 = -1, ovDirty = false;
  var sel = 1, used = 0, lastTs = Date.now(), gridOn = true, total = 0, penOn = false, rippleOn = true;
  var cw = 0, ch = 0, dpr = 1, s = 1, ox = 0, oy = 0, minS = 0.1, MAXS = 60;
  var hover = null, dirty = true, ripples = [];

  // ---- kayıt (yalnızca ayarlar ve sayaç) ----
  var saveT = null, account = null, guestTotal = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify({ used: used, ts: Date.now(), sel: sel, grid: gridOn, total: account ? guestTotal : total, pen: penOn, ripple: rippleOn })); } catch (e) {}
    }, 400);
  }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (saved) {
    if (typeof saved.sel === "number" && saved.sel >= 0 && saved.sel < COLORS.length) sel = saved.sel;
    if (typeof saved.used === "number" && typeof saved.ts === "number") used = Math.max(0, saved.used - (Date.now() - saved.ts) / 1000);
    if (typeof saved.grid === "boolean") gridOn = saved.grid;
    if (typeof saved.total === "number") { total = saved.total; guestTotal = saved.total; }
    if (typeof saved.pen === "boolean") penOn = saved.pen;
    if (typeof saved.ripple === "boolean") rippleOn = saved.ripple;
  }
  var TOKEN_KEY = "pixelDunya.token", token = "";
  try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
  // wss://x.workers.dev/ws  ->  https://x.workers.dev
  var API = WS_URL ? WS_URL.replace(/^ws/i, "http").replace(/\/ws\/?(\?.*)?$/, "") : "";
  var clientId = "";
  try { clientId = localStorage.getItem(ID_KEY) || ""; } catch (e) {}
  if (!clientId) {
    clientId = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { localStorage.setItem(ID_KEY, clientId); } catch (e) {}
  }

  // ---- ağ ----
  var ws = null, connected = false, onlineCount = 0, backoff = 1000, snapStarted = false;
  var outbox = [], flushT = null;
  var dot = document.getElementById("dot"), connTxt = document.getElementById("connTxt"), onlineTxt = document.getElementById("onlineTxt");
  function setStatus(st) {
    dot.setAttribute("data-st", st);
    connTxt.textContent = st === "connected" ? "Bağlı" : st === "connecting" ? "Bağlanıyor…" : "Yerel mod (sunucu yok)";
    onlineTxt.textContent = (st === "connected" && onlineCount > 0) ? String(onlineCount) : "–";
  }
  function scheduleReconnect() { setTimeout(connect, backoff); backoff = Math.min(15000, Math.round(backoff * 1.7)); }
  function connect() {
    if (!WS_URL) { setStatus("preview"); return; }
    if (ws) return;
    setStatus("connecting");
    var sock;
    try { sock = new WebSocket(WS_URL + (WS_URL.indexOf("?") >= 0 ? "&" : "?") + "id=" + encodeURIComponent(clientId) + (token ? "&token=" + encodeURIComponent(token) : "")); }
    catch (e) { scheduleReconnect(); return; }
    ws = sock; sock.binaryType = "arraybuffer"; snapStarted = false; connected = false;
    sock.onopen = function () { backoff = 1000; };
    sock.onmessage = function (ev) {
      if (typeof ev.data !== "string") onBinary(new Uint32Array(ev.data));
      else if (ev.data.charAt(0) === "{") { try { onJson(JSON.parse(ev.data)); } catch (e) {} }
    };
    sock.onclose = function () {
      if (ws !== sock) return;
      ws = null; connected = false; onlineCount = 0; outbox.length = 0;
      setStatus("connecting"); scheduleReconnect();
    };
    sock.onerror = function () { try { sock.close(); } catch (e) {} };
  }
  setInterval(function () { if (ws && ws.readyState === 1) { try { ws.send("ping"); } catch (e) {} } }, 30000);
  function reconnectNow() {
    var old = ws; ws = null; connected = false; onlineCount = 0; outbox.length = 0; backoff = 1000;
    if (old) { try { old.close(); } catch (e) {} }
    connect();
  }

  // ---- hesap ----
  var el = function (id) { return document.getElementById(id); };
  var acOut = el("acOut"), acIn = el("acIn"), acMsg = el("acMsg"), acName = el("acName"), acPass = el("acPass");
  var acBtns = [el("acCreate"), el("acLogin"), el("acRecBtn"), el("acLogout")];
  function acSay(t, ok) { acMsg.textContent = t || ""; acMsg.className = "amsg" + (ok ? " ok" : ""); }
  function acBusy(b) { acBtns.forEach(function (x) { x.disabled = b; }); }
  function renderAccount() {
    acOut.hidden = !!account; acIn.hidden = !account;
    if (account) {
      el("acNameTxt").textContent = account.name;
      el("acIdTxt").textContent = String(account.id);
    }
  }
  function setAccount(a) {
    if (!account) guestTotal = total;
    account = a; total = a.total;
    used = Math.max(0, a.used); lastTs = Date.now();
    renderAccount(); save();
  }
  function onJson(m) {
    if (m.type === "account" && m.account) setAccount(m.account);
    else if (m.type === "badtoken") { token = ""; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} if (account) clearAccount(); }
  }
  function clearAccount() {
    account = null; total = guestTotal; renderAccount(); save();
  }
  function api(path, body) {
    return fetch(API + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Bir hata oldu"); return j; }); });
  }
  function authDone(j, created) {
    token = j.token;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    acPass.value = ""; el("acRecPass").value = ""; el("acRecId").value = "";
    el("acRec").hidden = true; el("acForgot").setAttribute("aria-expanded", "false");
    setAccount(j.account);
    acSay(created ? "Hesabın hazır! ID'n: " + j.account.id + ". Şifreni unutursan bu ID ile kurtarırsın, bir yere not al." : "Giriş yapıldı.", true);
    reconnectNow();
  }
  function authCall(path, body, created) {
    if (!API) { acSay("Hesap için sunucu gerekli (config.js boş)."); return; }
    acBusy(true); acSay("");
    api(path, body).then(function (j) { acBusy(false); authDone(j, created); })
      .catch(function (e) { acBusy(false); acSay(e && e.message === "Failed to fetch" ? "Sunucuya ulaşılamadı." : (e && e.message) || "Bir hata oldu"); });
  }
  el("acCreate").addEventListener("click", function () {
    var n = acName.value.trim(), p = acPass.value;
    if (n.length < 3) { acSay("Kullanıcı adı en az 3 karakter olmalı."); return; }
    if (p.length < 6) { acSay("Şifre en az 6 karakter olmalı."); return; }
    authCall("/api/register", { name: n, password: p }, true);
  });
  el("acLogin").addEventListener("click", function () {
    if (!acName.value.trim() || !acPass.value) { acSay("Ad ve şifreyi yaz."); return; }
    authCall("/api/login", { name: acName.value.trim(), password: acPass.value }, false);
  });
  acPass.addEventListener("keydown", function (e) { if (e.key === "Enter") el("acLogin").click(); });
  el("acForgot").addEventListener("click", function () {
    var r = el("acRec"); r.hidden = !r.hidden;
    this.setAttribute("aria-expanded", r.hidden ? "false" : "true"); acSay("");
  });
  el("acRecId").addEventListener("input", function () { this.value = this.value.replace(/\D/g, "").slice(0, 6); });
  el("acRecBtn").addEventListener("click", function () {
    var id = el("acRecId").value, p = el("acRecPass").value;
    if (id.length !== 6) { acSay("ID 6 haneli olmalı."); return; }
    if (p.length < 6) { acSay("Yeni şifre en az 6 karakter olmalı."); return; }
    authCall("/api/recover", { id: id, password: p }, false);
  });
  el("acLogout").addEventListener("click", function () {
    var t = token; token = "";
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    if (API && t) api("/api/logout", { token: t }).catch(function () {});
    clearAccount(); acSay("Çıkış yapıldı."); reconnectNow();
  });
  if (!API) acSay("Hesaplar sunucu bağlanınca çalışır (config.js).");

  function markOv(idx) {
    var x = idx % IW, y = (idx / IW) | 0;
    if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
    if (y < by0) by0 = y; if (y > by1) by1 = y;
    ovDirty = true; dirty = true;
  }
  function flushOv() {
    if (!ovDirty) return;
